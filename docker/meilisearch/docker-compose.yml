services:
  meilisearch:
    image: getmeili/meilisearch:v1.20
    container_name: curling-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY required (32+ chars)}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: INFO
    volumes:
      - ./data.ms:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
